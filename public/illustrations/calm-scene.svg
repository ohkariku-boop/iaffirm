<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <!-- Soft ground / horizon wash -->
  <ellipse cx="400" cy="520" rx="380" ry="80" fill="#4a7c68" opacity="0.06"/>
  <ellipse cx="200" cy="480" rx="160" ry="40" fill="#d4af78" opacity="0.05"/>
  <ellipse cx="600" cy="490" rx="140" ry="35" fill="#4a7c68" opacity="0.05"/>

  <!-- Distant soft hills -->
  <path d="M0 380 Q120 320 250 360 Q380 400 500 340 Q620 290 800 360 L800 600 L0 600 Z" fill="#4a7c68" opacity="0.04"/>
  <path d="M0 420 Q180 370 320 410 Q480 450 650 380 Q750 350 800 390 L800 600 L0 600 Z" fill="#c4a882" opacity="0.04"/>

  <!-- Soft sun / moon glow -->
  <circle cx="620" cy="120" r="48" fill="#d4af78" opacity="0.12"/>
  <circle cx="620" cy="120" r="28" fill="#d4af78" opacity="0.08"/>

  <!-- Abstract leaves / organic shapes left -->
  <ellipse cx="90" cy="280" rx="18" ry="32" fill="#4a7c68" opacity="0.08" transform="rotate(-25 90 280)"/>
  <ellipse cx="120" cy="300" rx="14" ry="26" fill="#4a7c68" opacity="0.07" transform="rotate(15 120 300)"/>
  <ellipse cx="70" cy="320" rx="12" ry="22" fill="#5a9a78" opacity="0.06" transform="rotate(-10 70 320)"/>

  <!-- Abstract leaves right -->
  <ellipse cx="720" cy="300" rx="16" ry="30" fill="#4a7c68" opacity="0.07" transform="rotate(20 720 300)"/>
  <ellipse cx="745" cy="330" rx="12" ry="24" fill="#5a9a78" opacity="0.06" transform="rotate(-15 745 330)"/>

  <!-- Figure 1: seated person (left), contemplative pose - simplified elegant line -->
  <g opacity="0.14" stroke="#3d6b58" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Body seated -->
    <path d="M210 420 Q210 380 230 360 Q250 340 250 320"/>
    <!-- Head -->
    <circle cx="250" cy="300" r="18"/>
    <!-- Arms resting / soft gesture -->
    <path d="M230 360 Q200 370 190 400"/>
    <path d="M250 360 Q280 375 290 400"/>
    <!-- Legs crossed / seated -->
    <path d="M230 420 Q200 440 180 450"/>
    <path d="M250 420 Q280 440 300 450"/>
  </g>

  <!-- Figure 2: standing / thinking pose (right) -->
  <g opacity="0.12" stroke="#3d6b58" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Body -->
    <path d="M520 430 L520 340"/>
    <!-- Head -->
    <circle cx="520" cy="318" r="17"/>
    <!-- One hand near chin / thoughtful -->
    <path d="M520 360 Q545 350 555 330"/>
    <!-- Other arm relaxed -->
    <path d="M520 370 Q490 390 485 420"/>
    <!-- Legs -->
    <path d="M520 430 L500 490"/>
    <path d="M520 430 L545 490"/>
  </g>

  <!-- Soft floating dots / sparkles of thought -->
  <circle cx="280" cy="250" r="3" fill="#4a7c68" opacity="0.15"/>
  <circle cx="300" cy="230" r="2" fill="#d4af78" opacity="0.2"/>
  <circle cx="265" cy="235" r="2.5" fill="#4a7c68" opacity="0.12"/>
  <circle cx="560" cy="260" r="2.5" fill="#4a7c68" opacity="0.14"/>
  <circle cx="580" cy="245" r="2" fill="#d4af78" opacity="0.18"/>
  <circle cx="545" cy="275" r="2" fill="#4a7c68" opacity="0.1"/>
</svg>
